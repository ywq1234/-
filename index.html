<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试卷上传系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
</head>
<body>
    <div id="app">
        <el-container style="max-width: 800px; margin: 20px auto;">
            <el-main>
                <el-card>
                    <!-- 界面结构保持不变 -->
                    <div slot="header">
                        <span>上传试卷文件</span>
                    </div>
                    
                    <el-upload
                        drag
                        :auto-upload="false"
                        :on-change="handleFileChange"
                        :show-file-list="false"
                        action="#"
                        accept=".pdf,.jpg,.jpeg,.png"
                    >
                        <!-- 上传组件内容 -->
                    </el-upload>

                    <el-progress 
                        v-if="uploadProgress > 0"
                        :percentage="uploadProgress"
                        :status="uploadStatus"
                        style="margin-top: 20px;"
                    ></el-progress>

                    <div style="margin-top: 20px;">
                        <el-button
                            type="primary"
                            :loading="isUploading"
                            :disabled="!selectedFile"
                            @click="startUpload"
                        >
                            {{ isUploading ? '上传中...' : '开始上传' }}
                        </el-button>
                    </div>

                    <el-alert
                        v-if="uploadResult"
                        :title="uploadResult"
                        :type="uploadSuccess ? 'success' : 'error'"
                        show-icon
                        style="margin-top: 20px;"
                    ></el-alert>
                </el-card>
            </el-main>
        </el-container>
    </div>

    <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

    <script>
        // 配置常量
        const CLOUD_FUNCTION_URL = 'https://analyze-4gbej3877844ea2d-1343742632.ap-shanghai.app.tcloudbase.com/shangchuan';
        const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB

        new Vue({
            el: '#app',
            data() {
                return {
                    selectedFile: null,
                    isUploading: false,
                    uploadProgress: 0,
                    uploadStatus: null,
                    uploadResult: '',
                    uploadSuccess: false
                };
            },
            methods: {
                // 处理文件选择
                handleFileChange(file) {
                    if (file.size > MAX_FILE_SIZE) {
                        this.$message.error('文件大小不能超过50MB');
                        this.selectedFile = null;
                        return;
                    }
                    this.selectedFile = file.raw;
                    this.resetUploadStatus();
                },

                // 获取上传凭证（改进版）
                async getUploadCredentials() {
                    try {
                        const response = await fetch(CLOUD_FUNCTION_URL, {
                            method: 'POST'  // 明确请求方法
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.message || `请求失败 (${response.status})`);
                        }

                        return await response.json();
                    } catch (error) {
                        console.error('获取凭证失败:', error);
                        throw new Error(`凭证获取失败: ${error.message}`);
                    }
                },

                // 开始上传（优化版）
                async startUpload() {
                    if (!this.selectedFile) return;

                    this.isUploading = true;
                    this.resetUploadStatus();

                    try {
                        const credentials = await this.getUploadCredentials();
                        
                        const formData = new FormData();
                        Object.entries({
                            key: credentials.key,
                            policy: credentials.policy,
                            'q-sign-algorithm': credentials['q-sign-algorithm'],
                            'q-ak': credentials['q-ak'],
                            'q-key-time': credentials['q-key-time'],
                            'q-signature': credentials['q-signature'],
                            file: this.selectedFile
                        }).forEach(([key, value]) => formData.append(key, value));

                        const uploadUrl = `${credentials.url}/${credentials.key}`;
                        
                        await this.executeUpload(uploadUrl, formData);
                        
                        this.uploadSuccess = true;
                        this.uploadResult = `文件上传成功！访问地址：${uploadUrl}`;
                    } catch (error) {
                        this.uploadSuccess = false;
                        this.uploadResult = error.message;
                        console.error('上传失败:', error);
                    } finally {
                        this.isUploading = false;
                    }
                },

                // 执行XHR上传
                executeUpload(url, formData) {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', url, true);

                        // 进度处理
                        xhr.upload.onprogress = (e) => {
                            if (e.lengthComputable) {
                                this.uploadProgress = Math.round((e.loaded / e.total) * 100);
                            }
                        };

                        // 完成处理
                        xhr.onload = () => {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                resolve();
                            } else {
                                reject(new Error(`上传失败 (${xhr.status}): ${xhr.statusText}`));
                            }
                        };

                        xhr.onerror = () => {
                            reject(new Error('网络错误，请检查连接'));
                        };

                        xhr.send(formData);
                    });
                },

                // 重置上传状态
                resetUploadStatus() {
                    this.uploadProgress = 0;
                    this.uploadStatus = null;
                    this.uploadResult = '';
                }
            }
        });
    </script>
</body>
</html>
